name = "EU Trust & Green Commerce Suite"
client_id = "YOUR_CLIENT_ID"
application_url = "https://your-app-domain.com"
embedded = false

[build]
include_config_on_deploy = true

[auth]
redirect_urls = [
  "https://your-app-domain.com/api/auth/callback"
]

[webhooks]
api_version = "2024-07"

[app_proxy]
url = "https://your-app-domain.com/storefront"
subpath = "eu-suite"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_orders,write_orders,read_customers,write_customers,read_content,write_content"
